[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hexit-palette"
version = "1.0.0"
description = "Desktop image-to-color palette generator (k-means in CIELAB)"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.5", "numpy>=1.24"]
license = { text = "MIT" }

[project.gui-scripts]
hexit = "hexit.app:main"

[tool.setuptools]
packages = ["hexit"]
